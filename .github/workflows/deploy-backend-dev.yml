# .github/workflows/deploy-backend-dev.yml
name: Deploy Backend (Dev)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: asia-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sethcabs-backend-dev/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sethcabs-backend-dev \
            --image asia-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sethcabs-backend-dev/app:latest \
            --region asia-east1 \
            --platform managed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-env: '3.11'
          cache: 'pip'

      - name: Install dependencies for testing
        run: |
          pip install httpx fastapi pydantic firebase-admin python-dotenv pydantic-settings

      - name: Run API Schema & Integration Tests
        run: |
          python backend/scripts/test_phase6.py
