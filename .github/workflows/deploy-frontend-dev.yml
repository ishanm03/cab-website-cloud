# .github/workflows/deploy-frontend-dev.yml
name: Deploy Frontend (Dev)

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'backend/**'
      - 'terraform/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          projectId: ${{ vars.GCP_PROJECT_ID }}
          channelId: live

      - name: Fallback Direct Firebase CLI Deploy
        if: failure()
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }}
